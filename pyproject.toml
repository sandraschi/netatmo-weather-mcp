[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netatmo-weather-mcp"
version = "1.0.0"
description = "Netatmo Weather Station MCP Server - AI-powered weather monitoring with sampling and predictive analytics"
authors = [
    {name = "Sandra", email = "sandraschipal@gmail.com"}
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Home Automation",
    "Topic :: System :: Monitoring",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Typing :: Typed"
]
keywords = [
    "netatmo", "weather", "meteorology", "climate", "monitoring", "mcp", "fastmcp",
    "ai", "sampling", "predictive-analytics", "weather-station", "iot", "smart-home",
    "data-analysis", "machine-learning", "automation"
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "fastmcp>=3.4.4,<4", # Fleet standard: FastMCP 3.4
    "pyatmo>=6.0.0", # Netatmo API client
    "httpx>=0.27.0,<1.0.0", # Modern HTTP client
    "pydantic>=2.0.0,<3.0.0", # Data validation
    "python-dotenv>=1.0.0", # Environment management
    "asyncio-throttle>=1.0.0", # Rate limiting
    "aiocache>=0.12.0", # Async caching
    "tenacity>=8.2.0", # Retry logic
    "prometheus-client>=0.20.0", # Prometheus metrics
    "structlog>=23.1.0", # Structured logging
    "numpy>=1.24.0", # Numerical computing for AI features
    "pandas>=2.0.0", # Data analysis for weather patterns
    "scikit-learn>=1.3.0", # Machine learning for predictions
    "statsmodels>=0.14.0", # Statistical modeling
    "python-dateutil>=2.8.2", # Date utilities
    "anyio>=4.5.0", # Async utilities
    "tomli>=0.10.2; python_version < \"3.11\"", # TOML support for older Python
    "ruff>=0.16.0,<0.17",
    "prefab-ui>=0.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.16.0,<0.17",                       # Modern Python linter
    "respx>=0.20.0",                     # HTTP mocking for tests
    "fastmcp[test]>=3.4.2,<4",              # FastMCP testing tools (aligned with runtime 3.4)
    "types-requests>=2.31.0",            # Type stubs for requests
    "types-python-dateutil>=2.8.0",       # Type stubs for dateutil
    "jupyter>=1.0.0",                    # For data analysis notebooks
    "matplotlib>=3.7.0",                 # For weather visualizations
    "seaborn>=0.12.0",                   # Statistical visualizations
]

[project.scripts]
netatmo-weather-mcp = "netatmo_weather_mcp.server:main"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP", "RUF"]
ignore = ["S101", "B008", "S106", "S110", "S112", "S101", "B008", "S106", "S110", "S112", "RUF012", "S603", "S607", "S324", "E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
