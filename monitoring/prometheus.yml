# Prometheus configuration for Netatmo Weather MCP
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # The job name is added as a label `job=<job_name>` to any timeseries scraped from this config.
  - job_name: 'netatmo-weather-mcp'
    static_configs:
      - targets: ['localhost:9091']
    scrape_interval: 5s
    scrape_timeout: 3s

  # Example job for node exporter (system metrics)
  - job_name: 'node'
    static_configs:
      - targets: ['localhost:9100']

  # Example job for weather station health checks
  - job_name: 'netatmo-health'
    metrics_path: '/health'
    static_configs:
      - targets: ['localhost:3000']
    scrape_interval: 30s

