[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --strict-config
    --disable-warnings
    --tb=short
    -v
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, may hit external APIs)
    ai: AI-specific functionality tests
    sampling: Sampling algorithm tests
    slow: Slow-running tests
    external: Tests that require external services
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning